name: Forge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  FOUNDRY_PROFILE: ci

jobs:
  typescript:
    name: TypeScript quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:secrets
      - run: pnpm audit --audit-level high

  contracts:
    name: Solidity build, tests, size and ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm contracts:fmt:check
      - run: pnpm test:contracts
      - run: pnpm contracts:build
      - run: pnpm contracts:snapshot:check
      - run: pnpm abi:generate
      - run: git diff --exit-code -- artifacts/abi
      - run: pnpm verify:manifests

  local-e2e:
    name: Local Anvil vertical E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
